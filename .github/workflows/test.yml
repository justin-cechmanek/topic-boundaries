name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Testing philosophy: no mocks — tests exercise real code and real services.
# To keep CI running (not skipping) the full suite, this workflow installs the
# optional extras (viz: plotly/umap/matplotlib) and runs a Redis Stack service
# container, so both the visualization and the vector-index integration tests
# execute here. The in-test skips (importorskip, Redis-unreachable) remain so
# local runs without those extras still pass.
#
# REDIS_URL points at each job's disposable service container.

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      HF_HOME: ${{ github.workspace }}/hf_cache
      # umap-learn's numba backend needs a writable cache dir, else it errors
      # with "no locator available" on some runners.
      NUMBA_CACHE_DIR: ${{ github.workspace }}/numba_cache
      REDIS_URL: redis://localhost:6379/0

    # Redis Stack (RediSearch) so the vector-index integration tests actually run.
    services:
      redis:
        image: redis/redis-stack-server:7.4.0-v6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Embedding model (~80MB) is downloaded by the end-to-end pipeline test
      # once Redis is available; cache it so reruns skip the download.
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: hf_cache
          key: ${{ runner.os }}-hf-cache

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # GitHub runners have no GPU; CUDA wheels exhaust their disk.
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -e ".[dev,corpus,viz,docs]"

      - name: Verify Redis Stack connection
        run: python -c 'import os, redis; redis.from_url(os.environ["REDIS_URL"]).ping()'

      - name: Run tests
        run: python -m pytest -v --cov=topic_boundaries --cov-report=term-missing

      - name: Build documentation
        run: sphinx-build -b html -W --keep-going docs docs/_build/html
